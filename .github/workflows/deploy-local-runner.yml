name: Deploy via Local Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Python installation
        run: |
          python3 --version
          which python3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run quick tests
        run: |
          python3 run_tests.py --quick

      - name: Run linting
        run: |
          ruff check . || true

  build:
    name: Build Docker Images
    needs: test
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          cd docker_files
          docker build -f Dockerfile.backend -t cli-agent-backend:latest ..
          docker build -f Dockerfile.frontend -t cli-agent-frontend:latest ..
          docker build -f Dockerfile.isolated-exec -t cli-agent-isolated:latest ..

      - name: Clean up old images
        run: |
          docker image prune -f

      - name: Verify images
        run: |
          echo "=== Built Images ==="
          docker images --filter "reference=cli-agent-*" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
