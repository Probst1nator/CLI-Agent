name: Deploy to Production

on:
  push:
    branches:
      - release
      - production
  workflow_dispatch:  # Allow manual triggers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cli-agent-backend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_files/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/cli-agent-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_files/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract metadata for container manager image
        id: meta-manager
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/container-manager
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
      
      - name: Build and push container manager image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_files/Dockerfile.container-manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-manager.outputs.tags }}
          labels: ${{ steps.meta-manager.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            
            # Navigate to deployment directory
            cd ${{ secrets.DEPLOY_PATH || '/opt/cli-agent' }}
            
            # Pull latest code
            git pull origin release
            
            # Pull latest images from GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/cli-agent-frontend:latest
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/container-manager:latest
            
            # Tag images for local use
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest cli-agent-backend:latest
            docker tag ${{ env.REGISTRY }}/${{ github.repository }}/cli-agent-frontend:latest cli-agent-frontend:latest
            docker tag ${{ env.REGISTRY }}/${{ github.repository }}/container-manager:latest cli-agent-manager:latest
            
            # Restart infrastructure services
            cd docker_files
            docker compose -f docker-compose.infrastructure.yml pull
            docker compose -f docker-compose.infrastructure.yml up -d --force-recreate
            
            # Rolling update of backend containers
            echo "Starting rolling update of backend containers..."
            CONTAINERS=$(docker ps --filter "name=cli-agent-" --format "{{.Names}}" | grep -v "cli-agent-container-manager\|cli-agent-frontend\|cli-agent-traefik\|cli-agent-isolated")
            
            for container in $CONTAINERS; do
              echo "Restarting $container..."
              docker restart $container
              sleep 2
            done
            
            # Clean up old images
            docker image prune -f
            
            echo "✅ Deployment complete!"
      
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            # Check container health
            echo "=== Container Status ==="
            docker ps --filter "name=cli-agent-" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            
            # Check Container Manager health
            echo ""
            echo "=== Container Manager Health ==="
            curl -f http://localhost:8080/health || echo "❌ Container Manager unhealthy"
            
            # Check frontend health
            echo ""
            echo "=== Frontend Health ==="
            curl -f http://localhost/ -I || echo "❌ Frontend unhealthy"
      
      - name: Notify deployment status
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "📊 Deployment Summary for commit ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Triggered by: ${{ github.actor }}"
            echo "Time: $(date)"
