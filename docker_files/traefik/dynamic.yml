# Traefik Dynamic Configuration
# Middlewares and routing rules for CLI-Agent

http:
  middlewares:
    # General rate limiting (most endpoints)
    general-rate-limit:
      rateLimit:
        average: 20
        burst: 40
        period: 1m

    # Rate limiting for container manager endpoints
    # More permissive to allow normal frontend operation
    container-ops-limit:
      rateLimit:
        average: 50
        burst: 100
        period: 1m

    # More permissive rate limiting for read-only operations
    read-only-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1m

    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: false  # Set true in production with TLS
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          X-XSS-Protection: "1; mode=block"

    # Compression
    compress:
      compress: true
    
    # Strip /api/manager prefix for Container Manager
    strip-manager-prefix:
      stripPrefix:
        prefixes:
          - "/api/manager"

    # Strip /main prefix for OLD SaaS system
    strip-main-prefix:
      stripPrefix:
        prefixes:
          - "/main"

    # Strip /agents prefix for NEW SaaS system
    strip-agents-prefix:
      stripPrefix:
        prefixes:
          - "/agents"

    # Redirect /main to /main/ (trailing slash for SPA)
    redirect-main-slash:
      redirectRegex:
        regex: "^(.*)/main$"
        replacement: "${1}/main/"
        permanent: true

    # Redirect /agents to /agents/ (trailing slash for SPA)
    redirect-agents-slash:
      redirectRegex:
        regex: "^(.*)/agents$"
        replacement: "${1}/agents/"
        permanent: true

  routers:
    # Redirect /main to /main/ (highest priority)
    redirect-main:
      rule: "Host(`<YOUR_SERVER_IP>`) && Path(`/main`)"
      service: noop@internal
      priority: 100
      entryPoints:
        - web
      middlewares:
        - redirect-main-slash

    # Redirect /agents to /agents/ (highest priority)
    redirect-agents:
      rule: "Host(`<YOUR_SERVER_IP>`) && Path(`/agents`)"
      service: noop@internal
      priority: 100
      entryPoints:
        - web
      middlewares:
        - redirect-agents-slash

    # Container Manager API (OLD SaaS - moved to /main path)
    # Handles both /main/api/manager/* and /main/api/backend/* (WebSocket + HTTP proxy)
    # SECURITY: Only accept requests to local IP address
    container-manager:
      rule: "Host(`<YOUR_SERVER_IP>`) && (PathPrefix(`/main/api/manager`) || PathPrefix(`/main/api/backend`))"
      service: container-manager
      priority: 15  # Higher than frontend to match /main/* paths first
      entryPoints:
        - web
      middlewares:
        - strip-main-prefix
        - strip-manager-prefix
        # Rate limiting disabled for local deployment
        # - container-ops-limit
        - security-headers
        - compress

    # Frontend for OLD SaaS (/main path)
    frontend-main:
      rule: "Host(`<YOUR_SERVER_IP>`) && PathPrefix(`/main/`)"
      service: frontend-main
      priority: 10  # Lower than API routes
      entryPoints:
        - web
      middlewares:
        - strip-main-prefix
        - security-headers
        - compress

    # Container Manager API (NEW SaaS - /agents path)
    container-manager-agents:
      rule: "Host(`<YOUR_SERVER_IP>`) && (PathPrefix(`/agents/api/manager`) || PathPrefix(`/agents/api/backend`))"
      service: container-manager-agents
      priority: 15  # Higher than frontend
      entryPoints:
        - web
      middlewares:
        - strip-agents-prefix
        - strip-manager-prefix
        - security-headers
        - compress

    # Frontend for NEW SaaS (/agents path)
    frontend-agents:
      rule: "Host(`<YOUR_SERVER_IP>`) && PathPrefix(`/agents/`)"
      service: frontend-agents
      priority: 10  # Lower than API routes
      entryPoints:
        - web
      middlewares:
        - strip-agents-prefix
        - security-headers
        - compress

  services:
    container-manager:
      loadBalancer:
        servers:
          - url: "http://cli-agent-container-manager:8080"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 10s

    container-manager-agents:
      loadBalancer:
        servers:
          - url: "http://cli-agent-container-manager-agents:8080"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 10s

    frontend-main:
      loadBalancer:
        servers:
          - url: "http://cli-agent-frontend:80"

    frontend-agents:
      loadBalancer:
        servers:
          - url: "http://cli-agent-frontend-agents:80"
