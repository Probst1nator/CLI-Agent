# CLI-Agent Multi-Instance Development Configuration
# - Live source code mounting for instant updates
# - Per-browser-tab isolation with 3 instances
# - Session management and load balancing

version: '3.8'

services:
  # Session Manager Service
  session-manager:
    image: cli-agent-session-manager
    container_name: cli-agent-session-manager-dev
    restart: unless-stopped
    networks:
      - cli-agent-multi-dev-net
    ports:
      - "7870:8000"    # Different port for dev (7870)
    environment:
      - MAX_INSTANCES=3
      - INSTANCE_TIMEOUT=1800  # 30 minutes
      - BASE_PORT=7871         # Start dev instances at 7871
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CLI-Agent Development Instance 1
  cli-agent-dev-instance-1:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-dev-instance-1
    restart: unless-stopped
    networks:
      - cli-agent-multi-dev-net
    ports:
      - "7871:7860"  # Dev instance 1 direct access
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1  # Don't create .pyc files in dev
      - INSTANCE_ID=1
      - IDLE_TIMEOUT=300  # 5 minutes for dev testing
    volumes:
      # LIVE SOURCE CODE MOUNTING for development
      - ~/repos/CLI-Agent:/cli-agent:ro  # Read-only source code
      # Persistent data volumes
      - cli-agent-dev-data-1:/workspace/data
      - cli-agent-dev-logs-1:/workspace/logs
      - cli-agent-dev-temp-1:/workspace/temp
      - cli-agent-dev-config-1:/workspace/.cli-agent
      - cli-agent-dev-user-config-1:/home/cliagent/.config/cli-agent
    working_dir: /cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]

  # CLI-Agent Development Instance 2
  cli-agent-dev-instance-2:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-dev-instance-2
    restart: unless-stopped
    networks:
      - cli-agent-multi-dev-net
    ports:
      - "7872:7860"  # Dev instance 2 direct access
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - INSTANCE_ID=2
      - IDLE_TIMEOUT=300
    volumes:
      # LIVE SOURCE CODE MOUNTING for development
      - ~/repos/CLI-Agent:/cli-agent:ro
      # Persistent data volumes
      - cli-agent-dev-data-2:/workspace/data
      - cli-agent-dev-logs-2:/workspace/logs
      - cli-agent-dev-temp-2:/workspace/temp
      - cli-agent-dev-config-2:/workspace/.cli-agent
      - cli-agent-dev-user-config-2:/home/cliagent/.config/cli-agent
    working_dir: /cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]

  # CLI-Agent Development Instance 3
  cli-agent-dev-instance-3:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-dev-instance-3
    restart: unless-stopped
    networks:
      - cli-agent-multi-dev-net
    ports:
      - "7873:7860"  # Dev instance 3 direct access
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - INSTANCE_ID=3
      - IDLE_TIMEOUT=300
    volumes:
      # LIVE SOURCE CODE MOUNTING for development
      - ~/repos/CLI-Agent:/cli-agent:ro
      # Persistent data volumes
      - cli-agent-dev-data-3:/workspace/data
      - cli-agent-dev-logs-3:/workspace/logs
      - cli-agent-dev-temp-3:/workspace/temp
      - cli-agent-dev-config-3:/workspace/.cli-agent
      - cli-agent-dev-user-config-3:/home/cliagent/.config/cli-agent
    working_dir: /cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]

# Isolated development network
networks:
  cli-agent-multi-dev-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: cli-agent-multi-dev-br0
    ipam:
      driver: default
      config:
        - subnet: 172.32.0.0/24
          gateway: 172.32.0.1
    internal: false  # Allow internet access

# Development volumes with unique names
volumes:
  # Instance 1 volumes
  cli-agent-dev-data-1:
    driver: local
    name: cli-agent-dev-data-1
  cli-agent-dev-logs-1:
    driver: local
    name: cli-agent-dev-logs-1
  cli-agent-dev-temp-1:
    driver: local
    name: cli-agent-dev-temp-1
  cli-agent-dev-config-1:
    driver: local
    name: cli-agent-dev-config-1
  cli-agent-dev-user-config-1:
    driver: local
    name: cli-agent-dev-user-config-1

  # Instance 2 volumes
  cli-agent-dev-data-2:
    driver: local
    name: cli-agent-dev-data-2
  cli-agent-dev-logs-2:
    driver: local
    name: cli-agent-dev-logs-2
  cli-agent-dev-temp-2:
    driver: local
    name: cli-agent-dev-temp-2
  cli-agent-dev-config-2:
    driver: local
    name: cli-agent-dev-config-2
  cli-agent-dev-user-config-2:
    driver: local
    name: cli-agent-dev-user-config-2

  # Instance 3 volumes
  cli-agent-dev-data-3:
    driver: local
    name: cli-agent-dev-data-3
  cli-agent-dev-logs-3:
    driver: local
    name: cli-agent-dev-logs-3
  cli-agent-dev-temp-3:
    driver: local
    name: cli-agent-dev-temp-3
  cli-agent-dev-config-3:
    driver: local
    name: cli-agent-dev-config-3
  cli-agent-dev-user-config-3:
    driver: local
    name: cli-agent-dev-user-config-3