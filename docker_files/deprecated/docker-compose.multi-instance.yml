# CLI-Agent Multi-Instance Container Configuration
# - Creates multiple isolated CLI-Agent instances
# - Each instance runs on a different port
# - Session-based routing via reverse proxy
# - Auto-scaling based on demand

version: '3.8'

services:
  # Reverse proxy for session routing
  cli-agent-proxy:
    image: traefik:v3.0
    container_name: cli-agent-proxy
    restart: unless-stopped
    ports:
      - "7860:80"      # Main entry point
      - "8080:8080"    # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - cli-agent-multi-net
    depends_on:
      - cli-agent-instance-1
      - cli-agent-instance-2

  # CLI-Agent Instance 1
  cli-agent-instance-1:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-instance-1
    restart: unless-stopped
    networks:
      - cli-agent-multi-net
    ports:
      - "7861:7860"  # Instance 1 port
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=1
      - IDLE_TIMEOUT=300  # 5 minutes
    volumes:
      - cli-agent-data-1:/workspace/data
      - cli-agent-logs-1:/workspace/logs
      - cli-agent-temp-1:/workspace/temp
      - cli-agent-config-1:/workspace/.cli-agent
      - cli-agent-user-config-1:/home/cliagent/.config/cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.instance-1.rule=PathPrefix(`/`) && HeadersRegexp(`Cookie`, `session=instance-1`)"
      - "traefik.http.services.instance-1.loadbalancer.server.port=7860"

  # CLI-Agent Instance 2
  cli-agent-instance-2:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-instance-2
    restart: unless-stopped
    networks:
      - cli-agent-multi-net
    ports:
      - "7862:7860"  # Instance 2 port
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=2
      - IDLE_TIMEOUT=300  # 5 minutes
    volumes:
      - cli-agent-data-2:/workspace/data
      - cli-agent-logs-2:/workspace/logs
      - cli-agent-temp-2:/workspace/temp
      - cli-agent-config-2:/workspace/.cli-agent
      - cli-agent-user-config-2:/home/cliagent/.config/cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.instance-2.rule=PathPrefix(`/`) && HeadersRegexp(`Cookie`, `session=instance-2`)"
      - "traefik.http.services.instance-2.loadbalancer.server.port=7860"

  # Session Manager - assigns new connections to available instances
  session-manager:
    build:
      context: ../
      dockerfile: docker_files/Dockerfile.session-manager
    container_name: cli-agent-session-manager
    restart: unless-stopped
    networks:
      - cli-agent-multi-net
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.session-manager.rule=Path(`/api/session`)"
      - "traefik.http.services.session-manager.loadbalancer.server.port=8000"

# Multi-instance network
networks:
  cli-agent-multi-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: cli-agent-multi-br0
    ipam:
      driver: default
      config:
        - subnet: 172.32.0.0/24
          gateway: 172.32.0.1

# Separate volumes for each instance
volumes:
  cli-agent-data-1:
    driver: local
    name: cli-agent-multi-data-1
  cli-agent-logs-1:
    driver: local
    name: cli-agent-multi-logs-1
  cli-agent-temp-1:
    driver: local
    name: cli-agent-multi-temp-1
  cli-agent-config-1:
    driver: local
    name: cli-agent-multi-config-1
  cli-agent-user-config-1:
    driver: local
    name: cli-agent-multi-user-config-1
    
  cli-agent-data-2:
    driver: local
    name: cli-agent-multi-data-2
  cli-agent-logs-2:
    driver: local
    name: cli-agent-multi-logs-2
  cli-agent-temp-2:
    driver: local
    name: cli-agent-multi-temp-2
  cli-agent-config-2:
    driver: local
    name: cli-agent-multi-config-2
  cli-agent-user-config-2:
    driver: local
    name: cli-agent-multi-user-config-2