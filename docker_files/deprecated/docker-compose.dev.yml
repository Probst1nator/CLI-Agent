# CLI-Agent Development Container Configuration
# - Bind mounts source code for live reloading
# - Development environment with faster rebuild times
# - Same network isolation and security as production

version: '3.8'

services:
  cli-agent-dev:
    image: cli-agent:isolated
    container_name: cli-agent-dev
    restart: unless-stopped

    # Network configuration - isolated with internet only
    networks:
      - cli-agent-dev-net

    # Port mapping - expose only web UI to host network
    ports:
      - "7862:7860"  # Use different port for dev (7862)

    # Environment variables
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1  # Don't create .pyc files
      # Add your API keys here or use .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

    # Bind mount source code for live development
    volumes:
      - /home/prob/repos/CLI-Agent:/cli-agent:ro  # Read-only source code
      - cli-agent-dev-data:/workspace/data
      - cli-agent-dev-logs:/workspace/logs
      - cli-agent-dev-temp:/workspace/temp
      - cli-agent-dev-config:/workspace/.cli-agent

    # Working directory
    working_dir: /cli-agent

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=256m

    # Startup command
    command: ["python3", "main.py", "--gui"]

# Isolated network - no access to host network, only internet
networks:
  cli-agent-dev-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: cli-agent-dev-br0
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
    internal: false  # Allow internet access

# Persistent volumes for development
volumes:
  cli-agent-dev-data:
    driver: local
    name: cli-agent-dev-data
  cli-agent-dev-logs:
    driver: local
    name: cli-agent-dev-logs
  cli-agent-dev-temp:
    driver: local
    name: cli-agent-dev-temp
  cli-agent-dev-config:
    driver: local
    name: cli-agent-dev-config