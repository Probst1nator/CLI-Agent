# Traefik configuration for CLI-Agent multi-instance routing

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

# Session-based routing configuration
http:
  middlewares:
    session-assigner:
      plugin:
        dev:
          # Custom middleware to assign sessions to available instances
          # This would be implemented as a Traefik plugin
          assignNewSessions: true
          
  routers:
    # Default router for new sessions (no cookie)
    new-session:
      rule: "PathPrefix(`/`) && !HeadersRegexp(`Cookie`, `session=`)"
      middlewares:
        - session-assigner
      service: session-manager
    
    # Health check endpoint
    health:
      rule: "Path(`/health`)"
      service: session-manager

  services:
    session-manager:
      loadBalancer:
        servers:
          - url: "http://session-manager:8000"

# Logging
log:
  level: INFO
  
accessLog:
  format: json