version: '3.8'

# CLI-Agent Multi-User Infrastructure
# Traefik + Container Manager + Frontend

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: cli-agent-traefik
    restart: unless-stopped
    ports:
      - "<YOUR_SERVER_IP>:80:80"      # HTTP - Local IP only
      - "<YOUR_SERVER_IP>:443:443"    # HTTPS - Local IP only
      - "127.0.0.1:8080:8080"       # Traefik Dashboard - Localhost only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-logs:/var/log/traefik
      - traefik-letsencrypt:/letsencrypt
    networks:
      - cli-agent-network
    labels:
      - "traefik.enable=true"
      # Dashboard (disable in production or add auth)
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Container Manager
  container-manager:
    image: cli-agent-manager:latest
    container_name: cli-agent-container-manager
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - container-manager-data:/data
    networks:
      - cli-agent-network
    environment:
      - STORAGE_THRESHOLD=90
      - DEFAULT_RETENTION_DAYS=7
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.manager.rule=Host(`<YOUR_SERVER_IP>`) && (PathPrefix(`/api/manager`) || PathPrefix(`/api/backend`))"
      - "traefik.http.services.manager.loadbalancer.server.port=8080"
      - "traefik.http.routers.manager.middlewares=strip-manager-prefix@file,rate-limit@file,security-headers@file"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Nginx serving static files)
  frontend:
    build:
      context: ..
      dockerfile: docker_files/Dockerfile.frontend
    container_name: cli-agent-frontend
    restart: unless-stopped
    networks:
      - cli-agent-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`<YOUR_SERVER_IP>`) && PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.priority=1"  # Lowest priority (catch-all)
      - "traefik.http.routers.frontend.middlewares=security-headers@file,compress@file"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cli-agent-network:
    external: true
    name: cli-agent-network

volumes:
  traefik-logs:
    driver: local
    name: traefik-logs
  traefik-letsencrypt:
    driver: local
    name: traefik-letsencrypt
  container-manager-data:
    driver: local
    name: container-manager-data
