# Simple CLI-Agent Multi-Instance Setup
# - 3 CLI-Agent instances on ports 7861, 7862, 7863
# - Session manager on port 7860 (main entry point)
# - Each instance has isolated data and config

version: '3.8'

services:
  # Session Manager - main entry point
  session-manager:
    image: cli-agent-session-manager
    container_name: cli-agent-session-manager
    restart: unless-stopped
    ports:
      - "7860:8000"    # Main entry point
    environment:
      - MAX_INSTANCES=3
      - INSTANCE_TIMEOUT=1800  # 30 minutes
      - BASE_PORT=7861
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cli-agent-multi-net
    depends_on:
      - cli-agent-instance-1
      - cli-agent-instance-2

  # CLI-Agent Instance 1
  cli-agent-instance-1:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-instance-1
    restart: unless-stopped
    networks:
      - cli-agent-multi-net
    ports:
      - "7861:7860"  # Instance 1 direct access
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=1
      - IDLE_TIMEOUT=1800  # 30 minutes
    volumes:
      - cli-agent-data-1:/workspace/data
      - cli-agent-logs-1:/workspace/logs
      - cli-agent-temp-1:/workspace/temp
      - cli-agent-config-1:/workspace/.cli-agent
      - cli-agent-user-config-1:/home/cliagent/.config/cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]

  # CLI-Agent Instance 2
  cli-agent-instance-2:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-instance-2
    restart: unless-stopped
    networks:
      - cli-agent-multi-net
    ports:
      - "7862:7860"  # Instance 2 direct access
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=2
      - IDLE_TIMEOUT=1800  # 30 minutes
    volumes:
      - cli-agent-data-2:/workspace/data
      - cli-agent-logs-2:/workspace/logs
      - cli-agent-temp-2:/workspace/temp
      - cli-agent-config-2:/workspace/.cli-agent
      - cli-agent-user-config-2:/home/cliagent/.config/cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]

  # CLI-Agent Instance 3 (for scaling)
  cli-agent-instance-3:
    env_file:
      - ../.env
    image: cli-agent:isolated
    container_name: cli-agent-instance-3
    restart: unless-stopped
    networks:
      - cli-agent-multi-net
    ports:
      - "7863:7860"  # Instance 3 direct access
    environment:
      - CLI_AGENT_GUI_MODE=true
      - CLI_AGENT_HOST=0.0.0.0
      - CLI_AGENT_DATA_DIR=/workspace/data
      - CLI_AGENT_LOG_DIR=/workspace/logs
      - CLI_AGENT_TEMP_DIR=/workspace/temp
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=3
      - IDLE_TIMEOUT=1800  # 30 minutes
    volumes:
      - cli-agent-data-3:/workspace/data
      - cli-agent-logs-3:/workspace/logs
      - cli-agent-temp-3:/workspace/temp
      - cli-agent-config-3:/workspace/.cli-agent
      - cli-agent-user-config-3:/home/cliagent/.config/cli-agent
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python3", "main.py", "--gui"]

# Multi-instance network
networks:
  cli-agent-multi-net:
    driver: bridge

# Separate volumes for each instance
volumes:
  cli-agent-data-1:
    driver: local
    name: cli-agent-multi-data-1
  cli-agent-logs-1:
    driver: local
    name: cli-agent-multi-logs-1
  cli-agent-temp-1:
    driver: local
    name: cli-agent-multi-temp-1
  cli-agent-config-1:
    driver: local
    name: cli-agent-multi-config-1
  cli-agent-user-config-1:
    driver: local
    name: cli-agent-multi-user-config-1
    
  cli-agent-data-2:
    driver: local
    name: cli-agent-multi-data-2
  cli-agent-logs-2:
    driver: local
    name: cli-agent-multi-logs-2
  cli-agent-temp-2:
    driver: local
    name: cli-agent-multi-temp-2
  cli-agent-config-2:
    driver: local
    name: cli-agent-multi-config-2
  cli-agent-user-config-2:
    driver: local
    name: cli-agent-multi-user-config-2

  cli-agent-data-3:
    driver: local
    name: cli-agent-multi-data-3
  cli-agent-logs-3:
    driver: local
    name: cli-agent-multi-logs-3
  cli-agent-temp-3:
    driver: local
    name: cli-agent-multi-temp-3
  cli-agent-config-3:
    driver: local
    name: cli-agent-multi-config-3
  cli-agent-user-config-3:
    driver: local
    name: cli-agent-multi-user-config-3