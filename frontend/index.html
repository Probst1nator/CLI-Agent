<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Visual Response</title>

    <!-- Main Styles -->
    <link rel="stylesheet" href="/css/main.css">
    <!-- Component Styles -->
    <link rel="stylesheet" href="/css/components/loading-tools.css">

    <!-- Local JavaScript Libraries -->
    <script src="/libs/jquery.min.js"></script>
    <script src="/libs/marked.min.js"></script>
    <script src="/libs/mermaid.min.js"></script>
    <script src="/libs/plotly.min.js" charset="utf-8"></script>
    <script src="/libs/3Dmol-min.js"></script>
    <script src="/libs/svg-pan-zoom.min.js"></script>

    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>

    <!-- Modern Framework Libraries (CDN) - Production Builds -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div class="header">
        <div><div id="header-text">Agent's Live Visual Response</div><div id="status" style="color: var(--status-connecting);">Connecting to agent...</div></div>
        <div class="header-controls">
            <div class="profile-slots-container">
                <div class="profile-slots-grid">
                    <div class="profile-slot" data-slot="1" title="Profile Slot 1">
                        <span class="profile-slot-number">1</span>
                    </div>
                    <div class="profile-slot" data-slot="2" title="Profile Slot 2">
                        <span class="profile-slot-number">2</span>
                    </div>
                    <div class="profile-slot" data-slot="3" title="Profile Slot 3">
                        <span class="profile-slot-number">3</span>
                    </div>
                    <div class="profile-slot" data-slot="4" title="Profile Slot 4">
                        <span class="profile-slot-number">4</span>
                    </div>
                    <div class="profile-slot" data-slot="5" title="Profile Slot 5">
                        <span class="profile-slot-number">5</span>
                    </div>
                    <div class="profile-slot" data-slot="6" title="Profile Slot 6">
                        <span class="profile-slot-number">6</span>
                    </div>
                </div>
            </div>
            <div class="override-llm-container">
                <span class="override-llm-label">Override:</span>
                <div class="override-llm-selector-wrapper" title="Override LLM: When set, always uses this model, bypassing router/planner selection.">
                    <div id="override-llm-selector"></div>
                </div>
            </div>
            <div class="router-llm-container">
                <span class="router-llm-label">Router:</span>
                <div class="router-llm-selector-wrapper" title="Router LLM: Used for routing decisions. Can be set to None to disable routing.">
                    <div id="router-llm-selector"></div>
                </div>
            </div>
            <div class="planner-llm-container">
                <span class="planner-llm-label">Planner:</span>
                <div class="planner-llm-selector-wrapper" title="Planner LLM: Used for the first agent turn to establish initial reasoning and planning. Defaults to the first default model.">
                    <div id="planner-llm-selector"></div>
                </div>
            </div>
            <div class="llm-selection-container">
                <span class="llm-selection-label">Defaults:</span>
                <div class="llm-selectors-row">
                    <div class="llm-selector-wrapper">
                        <span class="llm-fallback-label">1st</span>
                        <div id="llm-selector-primary"></div>
                    </div>
                    <div class="llm-selector-wrapper">
                        <span class="llm-fallback-label">2nd</span>
                        <div id="llm-selector-fallback1"></div>
                    </div>
                    <div class="llm-selector-wrapper">
                        <span class="llm-fallback-label">3rd</span>
                        <div id="llm-selector-fallback2"></div>
                    </div>
                </div>
            </div>
            <button id="global-js-toggle" class="js-enabled" title="Toggle JavaScript for all messages">
                <span class="js-icon">⚡</span>
                <span class="js-text">JS Enabled</span>
            </button>
            <button id="console-toggle-btn" class="console-toggle-button" title="Toggle console log sidebar">
                <span class="console-icon">📺</span>
                <span class="console-text">Console</span>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="main-content-area">
            <div id="chat-history-sidebar" class="chat-history-sidebar">
                <div class="chat-history-resize-handle" id="chat-history-resize-handle"></div>
                <div class="chat-history-new-chat-container">
                    <button id="new-chat-btn" class="new-chat-button" title="Start new chat">
                        <span class="new-chat-icon">+</span>
                        <span class="new-chat-text">New Chat</span>
                    </button>
                </div>
                <div class="chat-history-header">
                    <button id="chat-history-toggle-btn" class="chat-history-toggle-btn" title="Toggle chat history sidebar">
                        <span class="hamburger-icon">☰</span>
                    </button>
                    <h3>Chat History</h3>
                </div>
                <div class="chat-history-search">
                    <input type="text" id="chat-history-search-input" placeholder="Search chats..." />
                    <button id="context-search-btn" class="context-search-button" title="Find similar chats based on current conversation">
                        <span class="context-search-icon">🔍📎</span>
                    </button>
                </div>
                <div id="chat-history-content" class="chat-history-content">
                    <!-- Chat list will be populated here -->
                </div>
            </div>

            <div id="content-wrapper">
                <!-- Dynamic content will be inserted here -->
            </div>

            <div id="console-sidebar" class="console-sidebar hidden">
                <div class="console-resize-handle" id="console-resize-handle"></div>
                <div class="console-header">
                    <h3>Console Log</h3>
                    <button id="console-clear-btn" class="console-clear-btn" title="Clear console log">🗑️</button>
                </div>
                <div id="console-content" class="console-content">
                    <div class="console-line">
                        <span class="console-timestamp">[00:00:00]</span>
                        <span class="console-text">Console log will appear here...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden wrappers for legacy compatibility -->
        <div id="plotly-wrapper"></div>
        <div id="molecule-wrapper"></div>
    </div></body>

    <!-- Tool Toggle Controls -->
    <div class="tool-toggles-container">
        <div class="tool-toggles">
            <div id="tool-toggles" class="tool-toggles-list">
                <!-- "Tools:" header and tool checkboxes will be dynamically generated here -->
            </div>
        </div>
    </div>

    <div class="chat-input-container">
        <form id="chat-form">
            <button type="button" id="file-upload-btn" class="file-upload-button" title="Upload files">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V20M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button type="button" id="screenshot-btn" class="screenshot-button" title="Take screenshot">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                    <path d="M21 15L16 10L5 21" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
            <button type="button" id="voice-btn" class="voice-button" title="Toggle voice mode (mic input + TTS) - /voice">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1C13.66 1 15 2.34 15 4V12C15 13.66 13.66 15 12 15C10.34 15 9 13.66 9 12V4C9 2.34 10.34 1 12 1Z" stroke="currentColor" stroke-width="2"/>
                    <path d="M19 10V12C19 16.42 15.42 20 11 20H13C17.42 20 21 16.42 21 12V10" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 20V24" stroke="currentColor" stroke-width="2"/>
                    <path d="M8 24H16" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
            <div class="speak-button-container">
                <div class="volume-slider-wrapper">
                    <span class="volume-label">100%</span>
                    <input type="range" id="tts-volume-slider" class="volume-slider" min="0" max="100" value="100" orient="vertical" title="TTS Volume">
                </div>
                <button type="button" id="speak-btn" class="speak-button" title="Toggle speak mode (TTS only, no mic) - /speak">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M15.54 8.46C16.4774 9.39764 17.0039 10.6692 17.0039 11.995C17.0039 13.3208 16.4774 14.5924 15.54 15.53" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M18.07 5.93C19.9447 7.80528 20.9979 10.3453 20.9979 13C20.9979 15.6547 19.9447 18.1947 18.07 20.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                </button>
            </div>
            <button type="button" id="screen-capture-btn" class="screen-capture-button" title="Capture screen/window/tab">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
            <input type="text" id="chat-input" placeholder="Send a message to the agent (or drag files here)..." autocomplete="off">
            <button type="button" id="interrupt-btn" class="interrupt-button-input" title="Stop/interrupt current AI generation">
                <span class="interrupt-icon">⏹</span>
            </button>
            <button type="submit">Send</button>
            <div id="send-indicator" class="send-indicator-overlay">✅ Sent</div>
        </form>
        <input type="file" id="file-input" multiple hidden>
        <div id="upload-status" class="file-upload-status" style="display: none;"></div>
    </div>

    <!-- Application Modules -->
    <script src="/js/logger.js"></script>
    <script src="/js/js-utils.js"></script>
    <script src="/js/renderers.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/chat-state.js"></script>
    <script src="/js/audio-manager.js"></script>
    <script src="/js/screen-capture.js"></script>
    <script src="/js/llm-selector.js"></script>
    <script src="/js/tool-manager.js"></script>
    <script src="/js/chat-history.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
