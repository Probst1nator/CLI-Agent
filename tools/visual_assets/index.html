<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Visual Response</title>

    <!-- Main Styles -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- Local JavaScript Libraries -->
    <script src="/libs/jquery.min.js"></script>
    <script src="/libs/marked.min.js"></script>
    <script src="/libs/mermaid.min.js"></script>
    <script src="/libs/plotly.min.js" charset="utf-8"></script>
    <script src="/libs/3Dmol-min.js"></script>
    <script src="/libs/svg-pan-zoom.min.js"></script>

    <!-- Modern Framework Libraries (CDN) - Production Builds -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div class="header">
        <div><div id="header-text">Agent's Live Visual Response</div><div id="status" style="color: var(--status-connecting);">Connecting to agent...</div></div>
        <div class="header-controls">
            <div class="router-llm-container">
                <span class="router-llm-label">Router:</span>
                <div class="router-llm-selector-wrapper" title="Router LLM: Used for routing decisions. Can be set to None to disable routing.">
                    <div id="router-llm-selector"></div>
                </div>
            </div>
            <div class="planner-llm-container">
                <span class="planner-llm-label">Planner:</span>
                <div class="planner-llm-selector-wrapper" title="Planner LLM: Used for the first agent turn to establish initial reasoning and planning. Defaults to the first default model.">
                    <div id="planner-llm-selector"></div>
                </div>
            </div>
            <div class="llm-selection-container">
                <span class="llm-selection-label">Defaults:</span>
                <div class="llm-selectors-row">
                    <div class="llm-selector-wrapper">
                        <span class="llm-fallback-label">1st</span>
                        <div id="llm-selector-primary"></div>
                    </div>
                    <div class="llm-selector-wrapper">
                        <span class="llm-fallback-label">2nd</span>
                        <div id="llm-selector-fallback1"></div>
                    </div>
                    <div class="llm-selector-wrapper">
                        <span class="llm-fallback-label">3rd</span>
                        <div id="llm-selector-fallback2"></div>
                    </div>
                </div>
            </div>
            <button id="reset-history-btn" class="reset-history-button" title="Reset message history">
                <span class="reset-icon">🔄</span>
                <span class="reset-text">Reset</span>
            </button>
            <button id="global-js-toggle" class="js-enabled" title="Toggle JavaScript for all messages">
                <span class="js-icon">⚡</span>
                <span class="js-text">JS Enabled</span>
            </button>
            <button id="console-toggle-btn" class="console-toggle-button" title="Toggle console log sidebar">
                <span class="console-icon">📺</span>
                <span class="console-text">Console</span>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="main-content-area">
            <div id="content-wrapper">
                <!-- Dynamic content will be inserted here -->
            </div>

            <div id="console-sidebar" class="console-sidebar hidden">
                <div class="console-resize-handle" id="console-resize-handle"></div>
                <div class="console-header">
                    <h3>Console Log</h3>
                    <button id="console-clear-btn" class="console-clear-btn" title="Clear console log">🗑️</button>
                </div>
                <div id="console-content" class="console-content">
                    <div class="console-line">
                        <span class="console-timestamp">[00:00:00]</span>
                        <span class="console-text">Console log will appear here...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden wrappers for legacy compatibility -->
        <div id="plotly-wrapper"></div>
        <div id="molecule-wrapper"></div>
    </div></body>

    <div class="chat-input-container">
        <form id="chat-form">
            <button type="button" id="file-upload-btn" class="file-upload-button" title="Upload files">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V20M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button type="button" id="screenshot-btn" class="screenshot-button" title="Take screenshot">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                    <path d="M21 15L16 10L5 21" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
            <input type="text" id="chat-input" placeholder="Send a message to the agent (or drag files here)..." autocomplete="off">
            <button type="button" id="interrupt-btn" class="interrupt-button-input" title="Stop/interrupt current AI generation">
                <span class="interrupt-icon">⏹</span>
            </button>
            <button type="submit">Send</button>
            <div id="send-indicator" class="send-indicator-overlay">✅ Sent</div>
        </form>
        <input type="file" id="file-input" multiple hidden>
        <div id="upload-status" class="file-upload-status" style="display: none;"></div>
    </div>

    <!-- Application Modules -->
    <script src="/js/logger.js"></script>
    <script src="/js/js-utils.js"></script>
    <script src="/js/renderers.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/llm-selector.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
